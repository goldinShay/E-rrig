<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-rrig Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-box {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        input {
            margin: 0.5rem 0;
            padding: 0.5rem;
            width: 100%;
        }
        button {
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .google-btn {
            background: #4285F4;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
<div class="login-box">
    <h2>Welcome to E-rrig</h2>

    <!-- Manual login form (optional, only works if formLogin is enabled) -->
    <form method="post" action="/login">
        <input type="text" name="username" placeholder="Username" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Login</button>
    </form>

    <!-- Google login button -->
    <a href="/oauth2/authorization/google">
        <button class="google-btn">Sign in with Google</button>
    </a>
</div>
</body>
</html>
