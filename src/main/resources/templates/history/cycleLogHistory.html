<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Cycle Log History</title>
  <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background-color: #fdfdfd;
            color: #222;
            transition: background-color 0.3s, color 0.3s;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            text-align: center;
        }
        th, td {
            padding: 8px;
            border-bottom: 1px solid #ccc;
            font-size: 14px;
        }
        th {
            background-color: #eee;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dark-mode {
            background-color: #1e1e1e;
            color: #ccc;
        }
        .dark-mode th {
            background-color: #333;
            color: #ffcc00;
        }
        .dark-mode td {
            border-bottom: 1px solid #555;
        }
        .toggle-button {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: inherit;
        }
        input[type="password"] {
            padding: 6px;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="header-controls">
  <!-- 🌑 Dark Mode Toggle -->
  <button class="toggle-button" onclick="toggleDarkMode()" id="modeToggle" title="Toggle dark mode">🌙</button>

  <!-- 🔐 Clear Button -->
  <button class="toggle-button" onclick="openClearModal()" title="Clear cycle logs">🗑️ Clear Cycle Logs</button>
</div>

<h2>🌱 Cycle Log History</h2>

<div th:if="${errorMessage}" class="error">
  <p th:text="${errorMessage}"></p>
</div>

<table>
  <thead>
  <tr>
    <th>Cycle Type</th>
    <th>UpdatedTS</th>
    <th>Active</th>
    <th>CO₂</th>
    <th>On Time</th>
    <th>Off Time</th>
    <th>Duration (Days)</th>
    <th>Spectrum (nm)</th>
    <th>Temp (°C)</th>
    <th>EC</th>
    <th>pH</th>
  </tr>
  </thead>

  <tbody>
  <tr th:each="log : ${cycleLogs}">
    <td th:text="${log.cycleType}">Grow</td>
    <td th:text="${#temporals.format(log.updatedTs, 'dd MMM yyyy HH:mm:ss')}">--</td>
    <td th:text="${log.active ? 'Yes' : 'No'}">Yes</td>
    <td th:text="${log.co2 ? 'Yes' : 'No'}">No</td>
    <td th:text="${#temporals.format(log.powerOnTime, 'HH:mm')}">06:00</td>
    <td th:text="${#temporals.format(log.powerOffTime, 'HH:mm')}">18:00</td>
    <td th:text="${log.cycleDurationDays}">28</td>
    <td th:text="${log.spectrum}">450</td>
    <td th:text="${log.temp}">20.0</td>
    <td th:text="${log.ec}">1.0</td>
    <td th:text="${log.ph}">7.0</td>
  </tr>
  </tbody>

</table>

<!-- 🔐 Clear Modal -->
<div id="clearModal" style="display: none; margin-top: 20px;">
  <form th:action="@{/history/cycles/clear}" method="post">
    <input type="password" name="password" placeholder="Enter password to clear cycle logs" required />
    <button type="submit">Confirm Clear</button>
    <button type="button" onclick="closeClearModal()">Cancel</button>
  </form>
</div>

<script>
function toggleDarkMode() {
    const body = document.body;
    const toggle = document.getElementById('modeToggle');
    body.classList.toggle('dark-mode');
    toggle.textContent = body.classList.contains('dark-mode') ? '☀️' : '🌙';
}

function openClearModal() {
    document.getElementById('clearModal').style.display = 'block';
}

function closeClearModal() {
    document.getElementById('clearModal').style.display = 'none';
}
</script>
</body>
</html>
