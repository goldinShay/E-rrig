<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Cycle Log History</title>
  <style>
        :root {
            --title-accent: #ffe58a;           /* warm white-yellow */
            --title-base: #ffffff;
            --table-dark-bg: rgba(10, 30, 80, 0.35); /* deep blue @ 35% */
            --table-dark-text: #fff3b0;        /* light yellow-white */
        }

        body {
    margin: 0;
    padding: 20px;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #000 url('/images/darkHydro01.png') no-repeat center center fixed;
    background-size: cover;
    color: #eee;
}

        /* Title styling: bright white with a hint of yellow glow */
        h2 {
            margin-top: 12px;
            font-size: 28px;
            color: var(--title-base);
            text-shadow:
                0 0 6px rgba(0,0,0,0.6),
                0 0 12px rgba(0,0,0,0.4),
                0 0 10px var(--title-accent);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            text-align: center;
            background: rgba(255,255,255,0.88);
            border-radius: 8px;
            overflow: hidden;
        }

        thead th {
            padding: 10px 8px;
            border-bottom: 1px solid #ccc;
            font-size: 14px;
            background-color: #eee;
            color: #222;
        }

        tbody td {
            padding: 8px;
            border-bottom: 1px solid #ccc;
            font-size: 14px;
            color: #222;
        }

        .error {
            color: #ff5252;
            margin-top: 10px;
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toggle-button {
            background: none;
            border: 1px solid #555;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            color: inherit;
            padding: 6px 10px;
        }

        input[type="password"] {
            padding: 6px;
            font-size: 14px;
        }

        /* Navigation bar */
        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 8px;
        }

        .nav-bar a {
            text-decoration: none;
        }

        .nav-bar button {
            background: #222;
            color: #eee;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.3s, transform 0.2s;
        }

        .nav-bar button:hover {
            background: #333;
            transform: translateY(-2px);
        }

        .nav-bar svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Dark mode overrides */
        .dark-mode {
            color: #ddd;
        }

        .dark-mode h2 {
            color: var(--title-base);
            text-shadow:
                0 0 6px rgba(0,0,0,0.7),
                0 0 12px rgba(0,0,0,0.5),
                0 0 12px var(--title-accent);
        }

        .dark-mode table {
            background: var(--table-dark-bg);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255,255,255,0.12);
        }

        .dark-mode thead th {
            background-color: rgba(30,30,30,0.85);
            color: #ffcc00; /* keep your perfect table title color */
            border-bottom: 1px solid rgba(255,255,255,0.12);
        }

        .dark-mode tbody td {
            color: var(--table-dark-text); /* match title’s warm tone */
            border-bottom: 1px solid rgba(255,255,255,0.12);
        }

        /* Clear modal */
        #clearModal {
            display: none;
            margin-top: 20px;
            background: rgba(0,0,0,0.6);
            padding: 12px;
            border-radius: 8px;
        }

        #clearModal form {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #clearModal button {
            background: #222;
            color: #eee;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
        }
  </style>
</head>
<body>
<div class="header-controls">
  <button class="toggle-button" onclick="toggleDarkMode()" id="modeToggle" title="Toggle dark mode">🌙</button>
  <button class="toggle-button" onclick="openClearModal()" title="Clear cycle logs">🗑️ Clear Cycle Logs</button>
</div>

<h2>🌱 Cycle Log History</h2>

<div class="nav-bar">
  <a href="/dashboard">
    <button>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
        <path d="M2 13h12v2H2v-2zm0-4h12v2H2V9zm0-4h12v2H2V5zm0-4h12v2H2V1z"/>
      </svg>
      Dashboard
    </button>
  </a>

  <a href="/">
    <button>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
        <path d="M8 .5l7 7V15a1 1 0 0 1-1 1h-4v-4H6v4H2a1 1 0 0 1-1-1V7.5l7-7z"/>
      </svg>
      Home
    </button>
  </a>

  <a href="/settings">
    <button>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
        <path d="M9.405 1.05a1 1 0 0 0-2.81 0l-.5 1.5a1 1 0 0 1-.95.69H3a1 1 0 0 0-1 1v1.145a1 1 0 0 1-.69.95l-1.5.5a1 1 0 0 0 0 1.9l1.5.5a1 1 0 0 1 .69.95V12a1 1 0 0 0 1 1h1.145a1 1 0 0 1 .95.69l.5 1.5a1 1 0 0 0 1.9 0l.5-1.5a1 1 0 0 1 .95-.69H12a1 1 0 0 0 1-1v-1.145a1 1 0 0 1 .69-.95l1.5-.5a1 1 0 0 0 0-1.9l-1.5-.5a1 1 0 0 1-.69-.95V4a1 1 0 0 0-1-1h-1.145a1 1 0 0 1-.95-.69l-.5-1.5zM8 5a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/>
      </svg>
      Settings
    </button>
  </a>
</div>

<div th:if="${errorMessage}" class="error">
  <p th:text="${errorMessage}"></p>
</div>

<table>
  <thead>
  <tr>
    <th>Cycle Type</th>
    <th>UpdatedTS</th>
    <th>Active</th>
    <th>CO₂</th>
    <th>On Time</th>
    <th>Off Time</th>
    <th>Duration (Days)</th>
    <th>Spectrum (nm)</th>
    <th>Temp (°C)</th>
    <th>EC</th>
    <th>pH</th>
  </tr>
  </thead>

  <tbody>
  <tr th:each="log : ${cycleLogs}">
    <td th:text="${log.cycleType}">Grow</td>
    <td th:text="${#temporals.format(log.updatedTs, 'dd MMM yyyy HH:mm:ss')}">--</td>
    <td th:text="${log.active ? 'Yes' : 'No'}">Yes</td>
    <td th:text="${log.co2 ? 'Yes' : 'No'}">No</td>
    <td th:text="${#temporals.format(log.powerOnTime, 'HH:mm')}">06:00</td>
    <td th:text="${#temporals.format(log.powerOffTime, 'HH:mm')}">18:00</td>
    <td th:text="${log.cycleDurationDays}">28</td>
    <td th:text="${log.spectrum}">450</td>
    <td th:text="${log.temp}">20.0</td>
    <td th:text="${log.ec}">1.0</td>
    <td th:text="${log.ph}">7.0</td>
  </tr>
  </tbody>
</table>

<div id="clearModal" style="display: none; margin-top: 20px;">
  <form th:action="@{/history/cycles/clear}" method="post">
    <input type="password" name="password" placeholder="Enter password to clear cycle logs" required />
    <button type="submit">Confirm Clear</button>
    <button type="button" onclick="closeClearModal()">Cancel</button>
  </form>
</div>

<script>
function toggleDarkMode() {
    const body = document.body;
    const toggle = document.getElementById('modeToggle');
    body.classList.toggle('dark-mode');
    toggle.textContent = body.classList.contains('dark-mode') ? '☀️' : '🌙';
}

function openClearModal() {
    const modal = document.getElementById('clearModal');
    modal.style.display = 'block';
}

function closeClearModal() {
    const modal = document.getElementById('clearModal');
    modal.style.display = 'none';
}
</script>
</body>
</html>
