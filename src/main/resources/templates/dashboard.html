<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>E-rrig/Dashboard</title>
    <meta http-equiv="refresh" content="300">
    <link rel="stylesheet" href="/css/dashboard.css">
    <script src="/js/dashboard.js" defer></script>
    <style>
    body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
        background-color: #111;
        color: #eee;
    }

    .dashboard {
        display: flex;
        height: 100vh;
    }

    .left-panel {
        width: 60%;
        padding: 30px;
    }

    .right-panel {
        width: 40%;
        padding: 30px;
        background-color: #222;
    }

    .status-light {
        display: inline-block;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        margin-right: 8px;
    }

    .green { background-color: #4CAF50; }
    .red { background-color: #f44336; }
    .blue { background-color: #2196F3; }
    .orange { background-color: #FF9800; }

    .control-group {
        margin-bottom: 20px;
    }

    /* Ticker styles — single-line scroll */
    .ticker {
        position: fixed;
        bottom: 0;
        width: 100%;
        height: 40px;
        background: #000;
        color: #8f0;
        font-family: monospace;
        overflow: hidden;
        display: flex;
        align-items: center;
        z-index: 10;
    }


    @keyframes scroll-left {
        0% { transform: translateX(0); }
        100% { transform: translateX(-100%); }
    }
</style>
</head>
<body>

<div class="dashboard">
    <div class="left-panel">
        <h2>Welcome <span th:text="${username}">User</span></h2>

        <div class="device-control">
            <label>Master Power:</label>
            <div class="mode-switch">
                <span th:classappend="${state.generalPower} ? 'status-light green' : 'status-light red'"></span>
            </div>
        </div>

        <div class="device-control">
            <label>Water Level:</label>
            <div class="mode-switch">
        <span th:switch="${state.waterLevelStatus}">
            <span th:case="'Too High'" class="status-light blue"></span>
            <span th:case="'Optimal'" class="status-light green"></span>
            <span th:case="'Low'" class="status-light orange"></span>
            <span th:case="'Too Low'" class="status-light red"></span>
        </span>
            </div>
        </div>


        <div class="device-control">
            <label>Lights:</label>
            <div class="mode-switch">
                <button type="submit" name="lightsMode" value="Off" th:classappend="${state.lightsMode == 'Off'} ? 'active'">Off</button>
                <button type="submit" name="lightsMode" value="On" th:classappend="${state.lightsMode == 'On'} ? 'active'">On</button>
                <button type="submit" name="lightsMode" value="Auto" th:classappend="${state.lightsMode == 'Auto'} ? 'active'">Auto</button>
            </div>
            <span th:classappend="${state.lightsOn} ? 'status-light green' : 'status-light red'"></span>
        </div>

        <div class="device-control">
            <label>Pumps:</label>
            <div class="mode-switch">
                <button type="submit" name="pumpsMode" value="Off" th:classappend="${state.pumpsMode == 'Off'} ? 'active'">Off</button>
                <button type="submit" name="pumpsMode" value="On" th:classappend="${state.pumpsMode == 'On'} ? 'active'">On</button>
                <button type="submit" name="pumpsMode" value="Auto" th:classappend="${state.pumpsMode == 'Auto'} ? 'active'">Auto</button>
            </div>
            <span th:classappend="${state.pumpsOn} ? 'status-light green' : 'status-light red'"></span>
        </div>

        <div class="device-control">
            <label>Blowers:</label>
            <div class="mode-switch">
                <button type="submit" name="blowersMode" value="Off" th:classappend="${state.blowersMode == 'Off'} ? 'active'">Off</button>
                <button type="submit" name="blowersMode" value="On" th:classappend="${state.blowersMode == 'On'} ? 'active'">On</button>
                <button type="submit" name="blowersMode" value="Auto" th:classappend="${state.blowersMode == 'Auto'} ? 'active'">Auto</button>
            </div>
            <span th:classappend="${state.blowersOn} ? 'status-light green' : 'status-light red'"></span>
        </div>

        <div class="device-control">
            <label>Fans:</label>
            <div class="mode-switch">
                <button type="submit" name="fansMode" value="Off" th:classappend="${state.fansMode == 'Off'} ? 'active'">Off</button>
                <button type="submit" name="fansMode" value="On" th:classappend="${state.fansMode == 'On'} ? 'active'">On</button>
                <button type="submit" name="fansMode" value="Auto" th:classappend="${state.fansMode == 'Auto'} ? 'active'">Auto</button>
            </div>
            <span th:classappend="${state.fansOn} ? 'status-light green' : 'status-light red'"></span>
        </div>

        <div class="device-control">
            <label>Fog Inducer:</label>
            <div class="mode-switch">
                <button type="submit" name="fogInducerMode" value="Off" th:classappend="${state.fogInducerMode == 'Off'} ? 'active'">Off</button>
                <button type="submit" name="fogInducerMode" value="On" th:classappend="${state.fogInducerMode == 'On'} ? 'active'">On</button>
                <button type="submit" name="fogInducerMode" value="Auto" th:classappend="${state.fogInducerMode == 'Auto'} ? 'active'">Auto</button>
            </div>
            <span th:classappend="${state.fogInducerOn} ? 'status-light green' : 'status-light red'"></span>
        </div>

        <div class="device-control">
            <label>Heater:</label>
            <div class="mode-switch">
                <button type="submit" name="heaterMode" value="Off" th:classappend="${state.heaterMode == 'Off'} ? 'active'">Off</button>
                <button type="submit" name="heaterMode" value="On" th:classappend="${state.heaterMode == 'On'} ? 'active'">On</button>
                <button type="submit" name="heaterMode" value="Auto" th:classappend="${state.heaterMode == 'Auto'} ? 'active'">Auto</button>
            </div>
            <span th:classappend="${state.heaterOn} ? 'status-light green' : 'status-light red'"></span>
        </div>

        <div class="device-control">
            <label>Air Vents:</label>
            <div class="mode-switch">
                <button type="submit" name="airVentsMode" value="Off" th:classappend="${state.airVentsMode == 'Off'} ? 'active'">Off</button>
                <button type="submit" name="airVentsMode" value="On" th:classappend="${state.airVentsMode == 'On'} ? 'active'">On</button>
                <button type="submit" name="airVentsMode" value="Auto" th:classappend="${state.airVentsMode == 'Auto'} ? 'active'">Auto</button>
            </div>
            <span th:classappend="${state.airVentsOn} ? 'status-light green' : 'status-light red'"></span>
        </div>
        <div class="device-control">
            <label>Cycle Mode:</label>
            <div class="mode-switch">
                <button type="submit" name="cycleMode" value="Grow" th:classappend="${state.cycleMode == 'Grow'} ? 'active'">Grow</button>
                <button type="submit" name="cycleMode" value="Bloom" th:classappend="${state.cycleMode == 'Bloom'} ? 'active'">Bloom</button>
            </div>
        </div>

        <div class="device-control">
            <label>Cycle Start:</label>
            <div class="mode-switch">
                <span th:text="${#temporals.format(state.cycleStartTime, 'dd MMM yyyy HH:mm')}">--</span>
            </div>
        </div>

        <div class="device-control">
            <label></label>
            <div class="mode-switch">
                <form action="/dashboard/startCycle" method="post">
                    <input type="hidden" name="cycleMode" th:value="${state.cycleMode}" />
                    <span th:switch="${state.cycleMode}">
                <button type="submit" th:case="'Grow'">Start Grow Cycle</button>
                <button type="submit" th:case="'Bloom'">Start Bloom Cycle</button>
                <button type="submit" th:case="*">Start Cycle</button>
            </span>
                </form>
            </div>
        </div>

        <div class="control-group">
            <strong>Power Consumption:</strong> <span th:text="${state.currentPowerUse}">0.0</span> W
        </div>
    </div>

    <div class="right-panel">
        <h3>Watch Your Plant Live!</h3>
        <iframe width="100%" height="315"
                src="https://www.youtube.com/embed/F0GOOP82094?autoplay=1"
                title="Live Stream"
                frameborder="0"
                allow="autoplay; encrypted-media"
                allowfullscreen>
        </iframe>
    </div>
</div>

<div class="ticker">
    <div class="ticker-data" th:if="${latestLog != null}">
        MSG#: <span th:text="${latestLog.messageNumber}">123</span> |
        Date: <span th:text="${#temporals.format(latestLog.timestamp, 'MM/dd/yyyy')}">11/02/2025</span> |
        Time: <span th:text="${#temporals.format(latestLog.timestamp, 'HH:mm')}">20:19</span> |
        Air Temp: <span th:text="${latestLog.airTemp} + '°C'">25.3°C</span> |
        Air Hum: <span th:text="${latestLog.airHum} + '%'">58%</span> |
        Pressure: <span th:text="${latestLog.airPres} + ' hPa'">1012.0 hPa</span> |
        CO₂: <span th:text="${latestLog.CO2ppm} + ' ppm'">420.0 ppm</span> |
        Water Temp: <span th:text="${latestLog.waterTemp} + '°C'">21.5°C</span> |
        pH: <span th:text="${latestLog.waterPH}">6.3</span> |
        EC: <span th:text="${latestLog.waterEC} + ' mS/cm'">1.8 mS/cm</span>
    </div>
    <div class="ticker-data" th:if="${latestLog == null}">
        Waiting for first sensor log from E-rrig system...
    </div>
</div>

</body>
</html>
