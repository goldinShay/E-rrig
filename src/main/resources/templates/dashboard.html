<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="/css/dashboard.css">
    <script src="/js/dashboard.js" defer></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #f5f5f5;
            overflow: hidden;
        }
        img.bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }
        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(144, 238, 144, 0.3); /* light green, 30% opacity */
            padding: 30px 50px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            max-height: 80vh;
            overflow-y: auto;
        }
        .scroll-container {
            max-height: 400px;
            overflow-y: auto;
        }
        .scroll-table {
            width: 100%;
            border-collapse: collapse;
        }
        .scroll-table th,
        .scroll-table td {
            padding: 10px 16px;
            border-bottom: 1px solid #ccc;
            text-align: left;
        }
        .scroll-table th {
            width: 40%;
            font-weight: bold;
        }
        .status-dot {
            height: 12px;
            width: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-on {
            background-color: #4CAF50; /* green */
        }
        .status-off {
            background-color: #f44336; /* red */
        }
        h2 {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<img src="/images/E-rrig001.png" alt="E-rrig Logo" class="bg">

<div class="content">
    <h2>Latest Sensor Pulse</h2>
    <div class="scroll-container">
        <table id="pulse-table" class="scroll-table">
            <tbody>
            <tr><td colspan="2">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
